[package]
name = "timer-extract"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "timer-extract"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
regex = "1"
serde_json = "1"
thiserror = "2"
yaxpeax-arm = "0.5"
yaxpeax-arch = "0.3"

[dev-dependencies]
lz4_flex = "0.14"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
